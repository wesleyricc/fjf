<!DOCTYPE html>
<html>
<head>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script>
    // ⚡ Segurança & FinOps: Restringe o token de debug do AppCheck exclusivamente ao ambiente local
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = "CA6668E1-026D-49E8-9AB2-6ED92C955076";
    }
  </script>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FJF App - Força Jovem Fumacense.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FJF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Meta tag para forçar a barra de status do navegador a ficar branca -->
  <meta name="theme-color" content="#FFFFFF">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>FJF</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <script src="flutter_bootstrap.js" async=""></script>

  <script>
    // Registra o service worker do Firebase Messaging para Push Notifications
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function(e) {
          console.warn('[FCM] Registro do service worker em background:', e);
        });
      });
    }
  </script>

  <script>
    // =========================================================================
    // AUTO-ATUALIZAÇÃO OTIMIZADA DO PWA (iOS Safari, Android Chrome e Desktop)
    // Inclui cooldown de 10 min para evitar spam de rede ao alternar abas (WhatsApp <-> App)
    // e preserva o service worker de Push Notifications (firebase-messaging-sw.js).
    // =========================================================================
    window.pwaUpdateAvailable = false;
    let lastUpdateCheckMs = 0;
    const UPDATE_CHECK_COOLDOWN_MS = 10 * 60 * 1000; // 10 minutos

    window.forcePwaUpdate = async function() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            const scriptUrl = (reg.active && reg.active.scriptURL) || '';
            if (!scriptUrl.includes('firebase-messaging-sw.js')) {
              await reg.unregister();
            }
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        localStorage.removeItem('fjf_pwa_version');
        localStorage.removeItem('fjf_pwa_build_tag');
      } catch (e) {
        console.error('[PWA] Erro na limpeza forçada:', e);
      }
      window.location.reload();
    };

    let isCheckingUpdate = false;
    async function checkAppUpdates(force = false) {
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return;
      }
      const now = Date.now();
      if (!force && (now - lastUpdateCheckMs) < UPDATE_CHECK_COOLDOWN_MS) {
        return;
      }
      if (isCheckingUpdate) return;
      isCheckingUpdate = true;
      lastUpdateCheckMs = now;

      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (const reg of registrations) {
              reg.update().catch(function() {});
            }
          }).catch(function() {});
        }

        const res = await fetch('version.json?t=' + now, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
        });

        if (res.ok) {
          const versionData = await res.json();
          const serverVersionId = (versionData.version || '') + '+' + (versionData.build_number || '');
          const currentSavedVersion = localStorage.getItem('fjf_pwa_version');

          if (!currentSavedVersion) {
            localStorage.setItem('fjf_pwa_version', serverVersionId);
          } else if (currentSavedVersion !== serverVersionId) {
            console.log('[PWA] Nova versão detectada em version.json:', currentSavedVersion, '->', serverVersionId);
            localStorage.setItem('fjf_pwa_version', serverVersionId);
            await applyAppUpdate();
            return;
          }
        }

        const headRes = await fetch('flutter_bootstrap.js?t=' + now, {
          method: 'HEAD',
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
        });

        const serverBuildTag = headRes.headers.get('etag') || headRes.headers.get('last-modified');
        if (serverBuildTag) {
          const savedBuildTag = localStorage.getItem('fjf_pwa_build_tag');
          if (!savedBuildTag) {
            localStorage.setItem('fjf_pwa_build_tag', serverBuildTag);
          } else if (savedBuildTag !== serverBuildTag) {
            console.log('[PWA] Novo deploy detectado por build tag:', savedBuildTag, '->', serverBuildTag);
            localStorage.setItem('fjf_pwa_build_tag', serverBuildTag);
            await applyAppUpdate();
            return;
          }
        }
      } catch (e) {
        console.debug('[PWA] Verificação offline ou de rede:', e);
      } finally {
        isCheckingUpdate = false;
      }
    }

    async function applyAppUpdate() {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            const scriptUrl = (reg.active && reg.active.scriptURL) || '';
            if (!scriptUrl.includes('firebase-messaging-sw.js')) {
              await reg.unregister();
            }
          }
        }
      } catch (e) {
        console.warn('[PWA] Erro ao limpar caches:', e);
      }
      console.log('[PWA] Reiniciando aplicação atualizada...');
      window.location.reload();
    }

    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!refreshing) {
          refreshing = true;
          console.log('[PWA] Novo Service Worker ativo. Recarregando...');
          window.location.reload();
        }
      });
    }

    window.addEventListener('load', function() {
      checkAppUpdates(true);
    });

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        checkAppUpdates(false);
      }
    });

    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAppUpdates(false);
      }
    });
  </script>
</body>
</html>

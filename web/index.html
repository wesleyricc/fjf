  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
  
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fjf_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FJF</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // 1. Configuração do Firebase
    var firebaseConfig = {
      apiKey: 'AIzaSyAI3SJkOCdY5Z5lC5hiSiXPeKUwsYu-u2w',
      authDomain: 'fjfapp.firebaseapp.com',
      projectId: 'fjfapp',
      storageBucket: 'fjfapp.firebasestorage.app',
      messagingSenderId: '211551139323',
      appId: '1:211551139323:web:f583360c18907986adc75e',
      measurementId: 'G-GNBBWGHX3G',
    };
    firebase.initializeApp(firebaseConfig);
    firebase.analytics();

    // 2. FORÇAR REMOÇÃO DE CACHE ANTIGO (Service Workers)
    // Isso é crucial para resolver a tela preta em celulares que "seguraram" a versão antiga
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // 3. CARREGAR O FLUTTER SEM CACHE
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      
      // Adiciona timestamp para obrigar o navegador a baixar o arquivo novo
      scriptTag.src = 'main.dart.js?v=' + new Date().getTime(); 
      
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    // Carrega o app imediatamente
    loadMainDartJs();
  </script>
</body>
</html>
